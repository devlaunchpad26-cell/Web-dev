<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Card</title>
    <style>
        *{
            width: 100vw;
            height: 100vh;
        }
        body{

            display: flex;
            align-items: center;
            justify-content: center;
            background-image: url(./abstract-background-with-patterned-glass-texture.jpg);
            background-position: cover;
        }
        .main{
            width: 200px;
            height: 250px;
            background-color: rgba(255, 255, 255, 0.268);
            box-shadow: 2px 2px 2px 1px rgb(0 0 0 / 20%);
            backdrop-filter: blur(5px);
            padding:10px;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            gap: 50px;
            

        }
        
        .upper{
            position: relative;
        }
        .img{
            
            position: absolute;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            overflow: hidden;
            
            
        }
        img{
            width: 40px;
            height: 40px;
            object-fit: cover;
        }

        .name{
            position: absolute;
            left:90px;
            top:2px;
        }
        h1{
            font-size: 20px;
            color: cadetblue;
        }
        .lower{
            position:absolute;
            height: 50px;
            left:70px;
            top:80px
            
        }
        
        .button{
            position:absolute;
            top:160px;
            left:80px;
        }
        #btn{
            width: 60px;
            height: 20px;

        }
    </style>
</head>
<body>
    
    <div class="main">
        <div class="upper">
             <div class="img">
            <img src="https://plus.unsplash.com/premium_photo-1688350808212-4e6908a03925?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MXx8cHJvZmVzc2lvbmFsJTIwcHJvZmlsZXxlbnwwfHwwfHx8MA%3D%3D" alt="profile_img">    
            </div>
            <div class="name">
                <h1>Name</h1>
                
            </div>
        </div>
        <div class="lower">
            <h1>Not Following</h1> 
        </div>
        <div class="button">
             <button id="btn">Follow</button>
        </div>
    </div>
    <script>
        const button = document.querySelector("#btn")
        const statustext = document.querySelector(".lower").children[0];
        console.log(statustext)
        let follow = true;

        button.addEventListener("click",(e)=>{
            if(follow){
                statustext.innerHTML = "Following";
                button.innerText = "Unfollow";
                follow = false;
            }
            else{
                statustext.innerHTML = "Not Following";
                button.innerText = "Follow";
                follow = true;
            }

        })
    </script>
</body>
</html>
